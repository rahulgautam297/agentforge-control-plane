[project]
name = "agentforge-control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agentforge-agent-schema",
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.2",
]

[tool.uv.sources]
agentforge-agent-schema = { git = "https://github.com/rahulgautam297/agentforge-agent-schema.git", rev = "v1.2.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_control_plane"]
